# Copy to .github/workflows/claude-review.yml in your own repo to run the same review on every pull request.
name: Claude review
on: pull_request
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review with Claude Haiku 5.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # a repo secret, never in the file
        run: |
          claude -p "Review the changed files for bugs that give wrong results or lose money." \
            --model claude-haiku-5-5 --output-format json \
            --json-schema "$(cat finding.schema.json)" \
            --allowedTools Read Grep Glob --max-turns 6 < /dev/null > review.json
          python3 gate.py review.json
